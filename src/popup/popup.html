<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fill My Form</title>
    <style>
      :root {
        --fg: #111;
        --muted: #777;
        --line: #e5e5e5;
      }
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        width: 240px;
        padding: 16px;
        margin: 0;
        box-sizing: border-box;
        color: var(--fg);
      }
      h3 {
        margin: 0 0 16px;
        font-size: 14px;
        font-weight: 600;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      select {
        width: 100%;
        padding: 6px 0;
        border: none;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        font: inherit;
        color: inherit;
        outline: none;
      }
      select:focus {
        border-bottom-color: var(--fg);
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 8px;
        border: 1px solid var(--fg);
        border-radius: 4px;
        background: var(--fg);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { 
        opacity: 0.85; 
      }
      button:disabled { 
        opacity: 0.3; 
        cursor: not-allowed; 
      }

      #status {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.4;
        min-height: 1.2em;
        color: var(--muted);
      }
      #status.error { 
        color: #b91c1c; 
      }
      #status.ok { 
        color: #15803d; 
      }

      .legend {
        display: none;
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .legend .green { 
        background: #22c55e;
      }
      .legend .yellow { 
        background: #eab308; 
      }

      .footer {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .footer a {
        color: var(--muted);
        text-decoration: none;
      }
      .footer a:hover { 
        color: var(--fg); 
      }
    </style>
  </head>
  <body>
    <h3>Fill My Form</h3>
    <label for="profileSelect">Profile</label>
    <select id="profileSelect">
      <option value="">Loading...</option>
    </select>

    <button id="fillButton">Fill my Form</button>

    <p id="status"></p>
    <div id=" legend" class="legend">
      <div><span class="green"></span>exact match</div>
      <div><span class="yellow"></span>Close match worth a glance</div>
    </div>

    <div class="footer">
      <a href="#" id="optionsLink">Profile</a>
      <a href="#" id="testFormBtn">Sample form</a>
      <a href="/privacy.html" target="_blank">Privacy</a>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
